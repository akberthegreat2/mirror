services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: mirror
      POSTGRES_USER: mirror
      POSTGRES_PASSWORD: mirror
    ports:
      - "5432:5432"
    volumes:
      - mirror-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirror -d mirror"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build: .
    environment:
      MIRROR_POSTGRES_DSN: postgresql://mirror:mirror@postgres:5432/mirror
      MIRROR_CELERY_BROKER_URL: redis://redis:6379/0
      MIRROR_WORKER_ID: mirror-worker-default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["--execution-class", "default", "--loglevel", "INFO"]

  beat:
    build: .
    environment:
      MIRROR_POSTGRES_DSN: postgresql://mirror:mirror@postgres:5432/mirror
      MIRROR_CELERY_BROKER_URL: redis://redis:6379/0
      MIRROR_WORKER_ID: mirror-beat
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "mirror_execution_celery.app", "beat", "--loglevel", "INFO", "--scheduler", "celery.beat.PersistentScheduler"]

  ollama:
    image: ollama/ollama:0.5
    ports:
      - "11434:11434"
    volumes:
      - mirror-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  chroma:
    image: chromadb/chroma:1.0
    ports:
      - "8000:8000"
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
    volumes:
      - mirror-chroma:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - mirror-opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  mirror-postgres:
  mirror-ollama:
  mirror-chroma:
  mirror-opensearch: