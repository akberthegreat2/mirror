[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = ["integration: requires real external infrastructure"]
# Discover every package test suite from the monorepo root.
testpaths = ["packages", "tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tomllib", "tomli", "yaml", "warcio"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "mirror_control_django.*",
    "mirror_control_api.*",
    "mirror_execution_celery.*",
    "mirror_crawl_scrapy.*",
    "mirror_archive_warc.*",
]
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_defs = true
allow_untyped_decorators = true
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "celery.*",
    "scrapy.*",
    "warcio.*",
    "rank_bm25",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# chromadb is typed but pulls numpy stubs that require Python 3.12+; we
# type-check at 3.10, so treat the whole backend as an opaque dependency.
module = ["chromadb.*"]
follow_imports = "skip"

[tool.ruff]
line-length = 400
