[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-transform-map"
version = "0.1.0"
description = "Mirror transform map provider"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "pydantic>=2.0",
    "mirror-transform>=0.1.0",
]

[project.entry-points."mirror.providers"]
map = "mirror_transform_map.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_transform_map*"]
namespaces = false

[tool.setuptools.package-data]
mirror_transform_map = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
