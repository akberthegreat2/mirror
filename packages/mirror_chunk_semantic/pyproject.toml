[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-chunk-semantic"
version = "0.1.0"
description = "Mirror chunk provider — embedding-aware semantic chunking"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "mirror-chunk>=0.1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
torch = ["sentence-transformers>=2.2"]

[project.entry-points."mirror.providers"]
semantic = "mirror_chunk_semantic.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_chunk_semantic*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]