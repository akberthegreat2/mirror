[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-fetch-curl-cffi"
version = "0.1.0"
description = "curl_cffi (curl-impersonate) provider for Mirror Fetch"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "mirror-fetch>=0.1.0",
    "curl_cffi>=0.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]
dev = ["ruff", "mypy"]

[project.entry-points."mirror.providers"]
curl_cffi = "mirror_fetch_curl_cffi:provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_fetch_curl_cffi*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["curl_cffi.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
