[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-database"
version = "0.1.0"
description = "Mirror database backend contract and entity models"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
sqlite = ["aiosqlite>=0.19"]
postgres = ["psycopg>=3.2"]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]
dev = ["ruff>=0.1.0", "mypy>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_database*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[project.entry-points."mirror.interfaces"]
database = "mirror_database.manifest:interface"