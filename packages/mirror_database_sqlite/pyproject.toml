[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-database-sqlite"
version = "0.1.0"
description = "Mirror SQLite database backend for local development and testing"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "mirror-database>=0.1.0",
    "aiosqlite>=0.19",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]
dev = ["ruff>=0.1.0", "mypy>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_database_sqlite*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]