[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-search-opensearch"
version = "0.1.0"
description = "OpenSearch provider for Mirror Search"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "mirror-search>=0.1.0",
    "opensearch-py>=2.0",
]

[project.entry-points."mirror.providers"]
opensearch = "mirror_search_opensearch.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_search_opensearch*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
