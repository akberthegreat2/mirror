[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-vectorstore-pgvector"
version = "0.1.0"
description = "pgvector provider for Mirror VectorStore"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "mirror-vectorstore>=0.1.0",
    "pgvector>=0.2",
    "psycopg>=3.1",
]

[project.entry-points."mirror.providers"]
pgvector = "mirror_vectorstore_pgvector.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_vectorstore_pgvector*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]