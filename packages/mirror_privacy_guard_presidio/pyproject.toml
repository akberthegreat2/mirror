[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-privacy-guard-presidio"
version = "0.1.0"
description = "Mirror privacy guard provider backed by Microsoft Presidio"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "mirror-privacy-guard>=0.1.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]

[project.entry-points."mirror.providers"]
presidio = "mirror_privacy_guard_presidio.provider:provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_privacy_guard_presidio*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]